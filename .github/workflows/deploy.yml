name: Deploy RSVP site to HostAfrica via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to server
        id: ftp
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            .git*
            .git/**
            .github/**
            .claude/**
            **/.DS_Store
            **/Thumbs.db
            **/desktop.ini
            *.md

      - name: Sync files to server (retry)
        if: steps.ftp.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            .git*
            .git/**
            .github/**
            .claude/**
            **/.DS_Store
            **/Thumbs.db
            **/desktop.ini
            *.md
